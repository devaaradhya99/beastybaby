<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Racer</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Orbitron', monospace;
      margin: 0;
      overflow: hidden;
    }
    
    .game-container {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    
    .road {
      background: linear-gradient(90deg, 
        #1a1a1a 0%, 
        #2d2d2d 10%, 
        #3d3d3d 15%,
        #3d3d3d 85%,
        #2d2d2d 90%,
        #1a1a1a 100%
      );
      position: relative;
      overflow: hidden;
    }
    
    .road-line {
      position: absolute;
      width: 8px;
      height: 60px;
      background: #ffd700;
      border-radius: 4px;
      left: 50%;
      transform: translateX(-50%);
      animation: roadMove 0.5s linear infinite;
    }
    
    @keyframes roadMove {
      0% { transform: translateX(-50%) translateY(-100px); }
      100% { transform: translateX(-50%) translateY(calc(100% + 100px)); }
    }
    
    .car {
      position: absolute;
      bottom: 80px;
      transition: left 0.5s ease-out;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }
    
    .obstacle {
      position: absolute;
      transition: top 0.050s linear;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }
    
    .coin {
      position: absolute;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border-radius: 50%;
      border: 3px solid #ff8c00;
      box-shadow: 0 0 15px #ffd700, inset 0 0 10px rgba(255,255,255,0.5);
      animation: spin 1s linear infinite, glow 0.5s ease-in-out infinite alternate;
    }
    
    @keyframes spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    
    @keyframes glow {
      0% { box-shadow: 0 0 15px #ffd700, inset 0 0 10px rgba(255,255,255,0.5); }
      100% { box-shadow: 0 0 25px #ffd700, inset 0 0 15px rgba(255,255,255,0.8); }
    }
    
    .explosion {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4500, #ff6347, transparent);
      animation: explode 0.5s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes explode {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    
    .score-popup {
      position: absolute;
      color: #ffd700;
      font-weight: bold;
      font-size: 1.2rem;
      animation: floatUp 0.8s ease-out forwards;
      pointer-events: none;
      text-shadow: 0 0 10px #ffd700;
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-50px); opacity: 0; }
    }
    
    .speedometer {
      background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
      border: 3px solid #444;
      border-radius: 10px;
    }
    
    .btn-game {
      background: linear-gradient(135deg, #e94560, #c73659);
      transition: all 0.2s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .btn-game:hover {
      background: linear-gradient(135deg, #ff6b6b, #e94560);
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(233, 69, 96, 0.5);
    }
    
    .game-over-overlay {
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="game-container h-full w-full flex flex-col items-center justify-center relative"><!-- Start Screen -->
   <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-gradient-to-b from-slate-900 via-purple-900 to-slate-900">
    <div class="text-center p-8">
     <h1 id="gameTitle" class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 mb-4 tracking-wider">ROAD RACER</h1>
     <p class="text-gray-400 text-lg mb-8">Dodge obstacles &amp; collect coins!</p><!-- Car Preview -->
     <div class="mb-8">
      <svg width="80" height="120" viewbox="0 0 60 100" class="mx-auto drop-shadow-2xl"><rect x="10" y="20" width="40" height="60" rx="8" fill="#e94560" /> <rect x="15" y="30" width="30" height="20" rx="3" fill="#87ceeb" opacity="0.8" /> <rect x="5" y="35" width="8" height="20" rx="2" fill="#333" /> <rect x="47" y="35" width="8" height="20" rx="2" fill="#333" /> <rect x="5" y="65" width="8" height="15" rx="2" fill="#333" /> <rect x="47" y="65" width="8" height="15" rx="2" fill="#333" /> <rect x="20" y="70" width="20" height="8" rx="2" fill="#ffaa00" /> <circle cx="18" cy="22" r="4" fill="#ffff00" /> <circle cx="42" cy="22" r="4" fill="#ffff00" />
      </svg>
     </div>
     <div class="space-y-4 text-gray-300 text-sm mb-8">
      <p>🎮 Use <span class="text-yellow-400 font-bold">← →</span> Arrow Keys or <span class="text-yellow-400 font-bold">A D</span> to move</p>
      <p>📱 Tap left/right side on mobile</p>
      <p>🪙 Collect coins for bonus points</p>
      <p>🚗 Avoid other vehicles!</p>
     </div><button id="startBtn" class="btn-game px-10 py-4 rounded-full text-white font-bold text-xl shadow-lg"> 🏁 START RACE </button>
    </div>
   </div><!-- Game Screen -->
   <div id="gameScreen" class="hidden absolute inset-0 flex flex-col"><!-- HUD -->
    <div class="absolute top-0 left-0 right-0 z-10 p-4 flex justify-between items-start">
     <div class="speedometer p-3 min-w-[120px]">
      <div class="text-gray-400 text-xs mb-1">
       SCORE
      </div>
      <div id="scoreDisplay" class="text-2xl font-bold text-yellow-400">
       0
      </div>
     </div>
     <div class="speedometer p-3 min-w-[100px] text-center">
      <div class="text-gray-400 text-xs mb-1">
       SPEED
      </div>
      <div id="speedDisplay" class="text-xl font-bold text-green-400">
       60 <span class="text-xs">MPH</span>
      </div>
     </div>
     <div class="speedometer p-3 min-w-[100px]">
      <div class="text-gray-400 text-xs mb-1">
       HIGH SCORE
      </div>
      <div id="highScoreDisplay" class="text-xl font-bold text-pink-400">
       0
      </div>
     </div>
    </div><!-- Road -->
    <div id="road" class="road flex-1 relative mx-auto w-full max-w-md"><!-- Road lines will be generated here --> <!-- Player Car -->
     <div id="playerCar" class="car" style="left: 50%;">
      <svg width="60" height="100" viewbox="0 0 60 100"><rect x="10" y="20" width="40" height="60" rx="8" fill="#e94560" /> <rect x="15" y="30" width="30" height="20" rx="3" fill="#87ceeb" opacity="0.8" /> <rect x="5" y="35" width="8" height="20" rx="2" fill="#333" /> <rect x="47" y="35" width="8" height="20" rx="2" fill="#333" /> <rect x="5" y="65" width="8" height="15" rx="2" fill="#333" /> <rect x="47" y="65" width="8" height="15" rx="2" fill="#333" /> <rect x="20" y="70" width="20" height="8" rx="2" fill="#ffaa00" /> <circle cx="18" cy="22" r="4" fill="#ffff00" /> <circle cx="42" cy="22" r="4" fill="#ffff00" />
      </svg>
     </div>
    </div><!-- Mobile Controls -->
    <div class="md:hidden absolute bottom-0 left-0 right-0 flex"><button id="leftBtn" class="flex-1 h-24 bg-black/30 active:bg-white/10 flex items-center justify-center"> <span class="text-4xl text-white/50">◀</span> </button> <button id="rightBtn" class="flex-1 h-24 bg-black/30 active:bg-white/10 flex items-center justify-center"> <span class="text-4xl text-white/50">▶</span> </button>
    </div>
   </div><!-- Game Over Screen -->
   <div id="gameOverScreen" class="hidden absolute inset-0 game-over-overlay flex flex-col items-center justify-center z-30">
    <div class="text-center p-8">
     <h2 class="text-4xl md:text-5xl font-black text-red-500 mb-4">GAME OVER</h2>
     <div class="mb-6">
      <p class="text-gray-400 text-lg">Your Score</p>
      <p id="finalScore" class="text-5xl font-bold text-yellow-400">0</p>
     </div>
     <div class="mb-8">
      <p class="text-gray-400">High Score</p>
      <p id="finalHighScore" class="text-2xl font-bold text-pink-400">0</p>
     </div><button id="restartBtn" class="btn-game px-8 py-3 rounded-full text-white font-bold text-lg"> 🔄 PLAY AGAIN </button>
    </div>
   </div>
  </div>
  <script>
    // Default configuration
    const defaultConfig = {
      game_title: 'ROAD RACER',
      primary_color: '#e94560',
      secondary_color: '#1a1a2e',
      accent_color: '#ffd700',
      text_color: '#ffffff',
      surface_color: '#2d2d2d'
    };

    let config = { ...defaultConfig };

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (newConfig) => {
          config = { ...defaultConfig, ...newConfig };
          applyConfig();
        },
        mapToCapabilities: (cfg) => ({
          recolorables: [
            {
              get: () => cfg.secondary_color || defaultConfig.secondary_color,
              set: (v) => { cfg.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); }
            },
            {
              get: () => cfg.surface_color || defaultConfig.surface_color,
              set: (v) => { cfg.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }
            },
            {
              get: () => cfg.text_color || defaultConfig.text_color,
              set: (v) => { cfg.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
            },
            {
              get: () => cfg.primary_color || defaultConfig.primary_color,
              set: (v) => { cfg.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); }
            },
            {
              get: () => cfg.accent_color || defaultConfig.accent_color,
              set: (v) => { cfg.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (cfg) => new Map([
          ['game_title', cfg.game_title || defaultConfig.game_title]
        ])
      });
    }

    function applyConfig() {
      const title = document.getElementById('gameTitle');
      if (title) {
        title.textContent = config.game_title || defaultConfig.game_title;
      }
    }

    // Game State
    let gameRunning = false;
    let score = 0;
    let highScore = 0;
    let speed = 5;
    let playerX = 50;
    let obstacles = [];
    let coins = [];
    let animationId = null;
    let lastObstacleTime = 0;
    let lastCoinTime = 0;
    let keysPressed = {};

    // DOM Elements
    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const playerCar = document.getElementById('playerCar');
    const road = document.getElementById('road');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const finalScore = document.getElementById('finalScore');
    const finalHighScore = document.getElementById('finalHighScore');

    // Generate road lines
    function createRoadLines() {
      for (let i = 0; i < 8; i++) {
        const line = document.createElement('div');
        line.className = 'road-line';
        line.style.animationDelay = `${i * 0.125}s`;
        line.style.top = `${i * 12.5}%`;
        road.appendChild(line);
      }
    }

    // Obstacle car colors
    const obstacleColors = ['#3498db', '#2ecc71', '#9b59b6', '#f39c12', '#1abc9c', '#e67e22'];

    function createObstacleSVG(color) {
      return `
        <svg width="50" height="80" viewBox="0 0 50 80">
          <rect x="8" y="15" width="34" height="50" rx="6" fill="${color}"/>
          <rect x="12" y="22" width="26" height="16" rx="2" fill="#333" opacity="0.7"/>
          <rect x="3" y="28" width="6" height="16" rx="2" fill="#222"/>
          <rect x="41" y="28" width="6" height="16" rx="2" fill="#222"/>
          <rect x="3" y="52" width="6" height="12" rx="2" fill="#222"/>
          <rect x="41" y="52" width="6" height="12" rx="2" fill="#222"/>
          <rect x="15" y="10" width="8" height="6" rx="1" fill="#ff4444"/>
          <rect x="27" y="10" width="8" height="6" rx="1" fill="#ff4444"/>
        </svg>
      `;
    }

    function spawnObstacle() {
      const roadRect = road.getBoundingClientRect();
      const lanes = [20, 50, 80];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      
      const obstacle = document.createElement('div');
      obstacle.className = 'obstacle';
      obstacle.innerHTML = createObstacleSVG(obstacleColors[Math.floor(Math.random() * obstacleColors.length)]);
      obstacle.style.left = `calc(${lane}% - 25px)`;
      obstacle.style.top = '-100px';
      obstacle.dataset.lane = lane;
      
      road.appendChild(obstacle);
      obstacles.push({
        element: obstacle,
        y: -100,
        lane: lane
      });
    }

    function spawnCoin() {
      const lanes = [25, 50, 75];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      
      const coin = document.createElement('div');
      coin.className = 'coin';
      coin.style.left = `calc(${lane}% - 15px)`;
      coin.style.top = '-50px';
      
      road.appendChild(coin);
      coins.push({
        element: coin,
        y: -50,
        lane: lane
      });
    }

    function showScorePopup(x, y, text) {
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = text;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      road.appendChild(popup);
      setTimeout(() => popup.remove(), 800);
    }

    function showExplosion(x, y) {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.style.left = `${x - 50}px`;
      explosion.style.top = `${y - 50}px`;
      road.appendChild(explosion);
      setTimeout(() => explosion.remove(), 500);
    }

    function checkCollision(playerRect, obstacleRect) {
      const padding = 10;
      return !(
        playerRect.right - padding < obstacleRect.left + padding ||
        playerRect.left + padding > obstacleRect.right - padding ||
        playerRect.bottom - padding < obstacleRect.top + padding ||
        playerRect.top + padding > obstacleRect.bottom - padding
      );
    }

    function updateGame(timestamp) {
      if (!gameRunning) return;

      const roadRect = road.getBoundingClientRect();
      const roadHeight = roadRect.height;

      // Spawn obstacles
      if (timestamp - lastObstacleTime > 1500 - speed * 50) {
        spawnObstacle();
        lastObstacleTime = timestamp;
      }

      // Spawn coins
      if (timestamp - lastCoinTime > 2000) {
        spawnCoin();
        lastCoinTime = timestamp;
      }

      // Update player position based on keys
      if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) {
        playerX = Math.max(15, playerX - 3);
      }
      if (keysPressed['ArrowRight'] || keysPressed['KeyD']) {
        playerX = Math.min(85, playerX + 3);
      }

      playerCar.style.left = `calc(${playerX}% - 30px)`;

      const playerRect = playerCar.getBoundingClientRect();

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += speed;
        obs.element.style.top = `${obs.y}px`;

        if (obs.y > roadHeight + 100) {
          obs.element.remove();
          obstacles.splice(i, 1);
          score += 10;
          continue;
        }

        const obsRect = obs.element.getBoundingClientRect();
        if (checkCollision(playerRect, obsRect)) {
          showExplosion(obsRect.left + 25, obsRect.top + 40);
          gameOver();
          return;
        }
      }

      // Update coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.y += speed;
        coin.element.style.top = `${coin.y}px`;

        if (coin.y > roadHeight + 50) {
          coin.element.remove();
          coins.splice(i, 1);
          continue;
        }

        const coinRect = coin.element.getBoundingClientRect();
        if (checkCollision(playerRect, coinRect)) {
          const coinX = coinRect.left - roadRect.left + 15;
          const coinY = coinRect.top - roadRect.top;
          showScorePopup(coinX, coinY, '+50');
          coin.element.remove();
          coins.splice(i, 1);
          score += 50;
        }
      }

      // Increase speed over time
      speed = Math.min(15, 5 + Math.floor(score / 200));

      // Update displays
      scoreDisplay.textContent = score;
      speedDisplay.innerHTML = `${60 + speed * 10} <span class="text-xs">MPH</span>`;

      animationId = requestAnimationFrame(updateGame);
    }

    function startGame() {
      gameRunning = true;
      score = 0;
      speed = 5;
      playerX = 50;
      obstacles = [];
      coins = [];
      lastObstacleTime = 0;
      lastCoinTime = 0;

      // Clear existing obstacles and coins
      document.querySelectorAll('.obstacle, .coin, .explosion, .score-popup').forEach(el => el.remove());

      playerCar.style.left = `calc(${playerX}% - 30px)`;
      scoreDisplay.textContent = '0';
      highScoreDisplay.textContent = highScore;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      animationId = requestAnimationFrame(updateGame);
    }

    function gameOver() {
      gameRunning = false;
      cancelAnimationFrame(animationId);

      if (score > highScore) {
        highScore = score;
      }

      finalScore.textContent = score;
      finalHighScore.textContent = highScore;
      highScoreDisplay.textContent = highScore;

      gameOverScreen.classList.remove('hidden');
    }

    // Event Listeners
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      keysPressed[e.code] = true;
    });

    document.addEventListener('keyup', (e) => {
      keysPressed[e.code] = false;
    });

    // Mobile controls
    document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
      e.preventDefault();
      keysPressed['ArrowLeft'] = true;
    });
    document.getElementById('leftBtn').addEventListener('touchend', () => {
      keysPressed['ArrowLeft'] = false;
    });
    document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
      e.preventDefault();
      keysPressed['ArrowRight'] = true;
    });
    document.getElementById('rightBtn').addEventListener('touchend', () => {
      keysPressed['ArrowRight'] = false;
    });

    // Initialize
    createRoadLines();
    applyConfig();
  </script>
